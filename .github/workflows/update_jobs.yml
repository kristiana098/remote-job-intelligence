name: Daily Job Aggregator Update

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch: # Allows manual trigger anytime from GitHub!

jobs:
  run-fetcher:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so GitHub Actions can push updates back to your repo!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job fetcher script
        env:
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
        run: |
          python job_fetcher.py

      - name: Commit and push updated CSV to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add cleaned_remote_jobs.csv
          git commit -m "Auto-update daily job postings dataset [skip ci]" || echo "No changes to commit"
          git push