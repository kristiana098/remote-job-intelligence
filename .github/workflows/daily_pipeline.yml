name: Daily Remote Job Scraper

on:
  schedule:
    # Runs automatically every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to run it manually anytime from GitHub

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run job fetcher script
        run: python job_fetcher.py

      - name: Commit and push updated job data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cleaned_remote_jobs.csv
          git diff --staged --quiet || git commit -m "Auto-update job listings [skip ci]"
          git push